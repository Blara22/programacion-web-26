<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cafetería · Ejemplo DOM II</title>
  <link rel="stylesheet" href="estilos.css">
  <!-- Los módulos son diferidos: pueden ir en el head sin defer -->
  <script type="module" src="js/main.js"></script>
</head>

<body>
  <header>
    <h1>☕ Cafetería · Ejemplo DOM II</h1>
  </header>

  <main>
    <section>
      <h2>Menú</h2>
      <div id="catalogo"></div>

      <!-- novalidate: los mensajes de error los mostramos nosotros -->
      <form id="form-producto" novalidate>
        <h2>Agregar un producto al menú</h2>
        <div class="campo">
          <label for="p-nombre">Nombre</label>
          <input id="p-nombre" name="nombre" required minlength="3" maxlength="30" placeholder="Ej. Té chai">
          <span class="error-campo" data-error-para="nombre"></span>
        </div>
        <div class="campo">
          <label for="p-precio">Precio</label>
          <input id="p-precio" name="precio" type="number" required min="1" max="500" step="any" placeholder="Ej. 45">
          <span class="error-campo" data-error-para="precio"></span>
        </div>
        <div class="campo">
          <label for="p-emoji">Ícono</label>
          <select id="p-emoji" name="emoji">
            <option>🆕</option><option>☕</option><option>🥛</option><option>🥐</option><option>🍰</option>
          </select>
        </div>
        <button type="submit">Agregar al menú</button>
        <p class="mensaje"></p>
      </form>
    </section>

    <section>
      <h2>Tu pedido</h2>
      <p id="vacio" class="vacio">Aún no agregas nada.</p>
      <ul id="carrito"></ul>
      <p class="total">Total: $<span id="total">0.00</span></p>

      <form id="form-pedido" novalidate>
        <h2>Confirmar pedido</h2>
        <div class="campo">
          <label for="c-nombre">Tu nombre</label>
          <input id="c-nombre" name="nombre">
          <span class="error-campo" data-error-para="nombre"></span>
        </div>
        <div class="campo">
          <label for="c-email">Correo</label>
          <input id="c-email" name="email" type="email">
          <span class="error-campo" data-error-para="email"></span>
        </div>
        <span class="error-campo" data-error-para="carrito"></span>
        <button type="submit">Confirmar pedido</button>
        <p class="mensaje"></p>
      </form>

      <div id="log">Haz clic en cualquier lugar…</div>
    </section>
  </main>

  <!-- Moldes: su contenido no se muestra -->
  <template id="tpl-tarjeta">
    <article class="tarjeta">
      <div class="emoji"></div>
      <h3></h3>
      <p class="precio"></p>
      <button type="button" data-accion="agregar">Agregar</button>
      <button type="button" class="fav" data-accion="favorito" aria-pressed="false">♡</button>
    </article>
  </template>

  <template id="tpl-item-carrito">
    <li>
      <span class="nombre"></span>
      <button type="button" class="mini" data-accion="menos">−</button>
      <span class="cantidad"></span>
      <button type="button" class="mini" data-accion="mas">+</button>
      <span class="subtotal"></span>
      <button type="button" class="mini" data-accion="quitar">✕</button>
    </li>
  </template>
</body>

</html>
