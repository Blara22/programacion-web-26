<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Ejemplo de tablas HTML</h1>
  <table border="1">
    <caption>Calificaciones del grupo</caption>
    <thead>
      <tr>
        <th scope="col">Matrícula</th>
        <th scope="col">Nombre</th>
        <th scope="col">Materia</th>
        <th scope="col">Calificación</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>001</td>
        <td>Ana</td>
        <td>Base de Datos</td>
        <td>65</td>
      </tr>
      <tr>
        <td>002</td>
        <td>Luis</td>
        <td>Base de Datos</td>
        <td>90</td>
      </tr>
      <tr>
        <td>003</td>
        <td>Juanito</td>
        <td>Base de Datos</td>
        <td>86</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <th scope="row" colspan="3">
          Promedio del grupo
        </th>
        <td>80</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
